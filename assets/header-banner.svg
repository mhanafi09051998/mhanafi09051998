<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="896" height="256" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  
  <!-- Subtle Grid Overlay -->
  <rect x="2" y="2" width="896" height="256" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="820" cy="40" r="140" fill="#0284c7" opacity="0.15" />
  <circle cx="90" cy="220" r="110" fill="#6366f1" opacity="0.12" />

  <!-- Top Pill Badge -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="380" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="4.5" fill="#10b981" />
    <text x="28" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">GAHAR INOVASI TEKNOLOGI • LEAD AI ENGINEER</text>
  </g>

  <!-- Main Name Title -->
  <text x="48" y="110" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Muhammad Hanafi, S.Tr.Kom.</text>

  <!-- Role Subtitle -->
  <text x="48" y="144" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500">
    <tspan fill="#38bdf8" font-weight="600">Lead AI Engineer</tspan> &amp; <tspan fill="#e2e8f0" font-weight="600">Full-Stack Systems Architect</tspan>
  </text>

  <!-- Tagline -->
  <text x="48" y="176" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic">
    "Crafting High-Performance Distributed Systems, Autonomous AI Engines &amp; Next-Gen Web Ecosystems"
  </text>

  <!-- Bottom Badges / Tech Highlights -->
  <g transform="translate(48, 206)">
    <!-- Pill 1: Minimality Ladder -->
    <rect x="0" y="0" width="138" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="69" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">⚡ Minimality Ladder</text>

    <!-- Pill 2: Zero-Boilerplate -->
    <rect x="148" y="0" width="132" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="214" y="16" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">🛡️ Zero-Boilerplate</text>

    <!-- Pill 3: Fast I/O -->
    <rect x="290" y="0" width="128" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="354" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">🚀 Sub-ms Fast I/O</text>

    <!-- Pill 4: Edge Architecture -->
    <rect x="428" y="0" width="148" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="502" y="16" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">🌐 Edge Architecture</text>
  </g>
</svg>
